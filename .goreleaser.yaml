version: 2

project_name: gophkeeper

before:
  hooks:
    - go mod tidy -diff
    - go vet ./...

builds:
  - id: client
    main: ./cmd/client
    binary: gophkeeper
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.buildVersion={{ .Version }} -X main.buildDate={{ .Date }}

  - id: server
    main: ./cmd/server
    binary: gophkeeper-server
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.buildVersion={{ .Version }} -X main.buildDate={{ .Date }}

archives:
  - id: client
    ids: [client]
    name_template: "gophkeeper_client_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - documentation/**/*

  - id: server
    ids: [server]
    name_template: "gophkeeper_server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - documentation/**/*

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs?:"
      - "^test:"

release:
  prerelease: auto
